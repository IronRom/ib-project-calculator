# ПРОД (pir.i-build.tech): образы из GHCR, порты только на localhost,
# postgres без публикации наружу. Деплой: .github/workflows/deploy.yml
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pir_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pir_calc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pir_user -d pir_calc"]
      interval: 10s
      retries: 10

  backend:
    image: ghcr.io/ironrom/ib-pir-backend:latest
    restart: unless-stopped
    # Надёжный DNS для контейнера: резолвер хоста (198.18.18.18) периодически
    # не резолвит внешние хосты (openrouter/ghcr) — пинним публичные напрямую
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      DATABASE_URL: postgresql://pir_user:${DB_PASSWORD}@db:5432/pir_calc
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Гео-блок OpenRouter для IP сервера: задать прокси в /opt/pir/.env
      # (OPENROUTER_PROXY=http://user:pass@host:port) — httpx уважает env
      HTTPS_PROXY: ${OPENROUTER_PROXY:-}
      HTTP_PROXY: ${OPENROUTER_PROXY:-}
      NO_PROXY: db,localhost,127.0.0.1
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BOT_API_SECRET: ${BOT_API_SECRET}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-ib_pir_bot}
    depends_on:
      db:
        condition: service_healthy
      or-vless:
        condition: service_started
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - uploads:/app/uploads

  bot:
    image: ghcr.io/ironrom/ib-pir-bot:latest
    restart: unless-stopped
    # Боту критично резолвить api.telegram.org — не полагаемся на хостовый DNS
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BACKEND_URL: http://backend:8000
      BOT_API_SECRET: ${BOT_API_SECRET}
      # Тот же гео-обход OpenRouter не нужен боту — он ходит только в backend
      NO_PROXY: backend,db,localhost,127.0.0.1
    depends_on:
      - backend

  frontend:
    image: ghcr.io/ironrom/ib-pir-frontend:latest
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      NEXT_PUBLIC_API_URL: https://pir.i-build.tech/api
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      - backend

  # Egress-прокси для OpenRouter: OpenRouter гео-блокирует российский IP прод-
  # сервера (403 "Access denied by security policy"). Xray-клиент поднимает
  # локальный HTTP-прокси на :8118 и уводит трафик по VLESS+Reality на узел
  # заказчика (выход — Лондон); backend ходит через него
  # (OPENROUTER_PROXY=http://or-vless:8118 в /opt/pir/.env).
  # Параметры узла (uuid/pbk/sid/sni) — в /opt/pir/xray/config.json, НЕ в репо.
  # Прежняя схема (gost + shadowsocks к ноде 45.11.24.128) снята 04.09.2026:
  # ТСПУ режет прод→нода по данным (TCP-хендшейк проходит, payload дропается).
  or-vless:
    image: teddysun/xray:latest
    container_name: or-vless
    restart: unless-stopped
    volumes:
      - /opt/pir/xray/config.json:/etc/xray/config.json:ro

volumes:
  pgdata:
  uploads:
